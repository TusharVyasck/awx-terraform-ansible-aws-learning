---
version: 3

images:
  base_image:
    name: quay.io/ansible/awx-ee:latest

dependencies:
  galaxy: ../ansible/requirements.yml
  system: bindep.txt
  ansible_core:
    package_pip: "ansible>=4.6.0,<7.7.0"
  ansible_runner:
    package_pip: "ansible-runner>=2.0.0,<3.0.0"

additional_build_steps:
  append_base:
    - RUN python3 -m pip install --upgrade pip
    - RUN yum install -y gcc python3-devel && yum clean all
    - RUN curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.0/terraform_1.9.0_linux_amd64.zip
    - RUN unzip -o /tmp/terraform.zip -d /usr/bin && rm -f /tmp/terraform.zip