---
version: 3

images:
  base_image:
    name: quay.io/ansible/awx-ee:latest

dependencies:
  galaxy: ../ansible/requirements.yml
  system: bindep.txt

additional_build_steps:
  append_base:
    - RUN curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.0/terraform_1.9.0_linux_amd64.zip
    - RUN unzip -o /tmp/terraform.zip -d /usr/bin && rm -f /tmp/terraform.zip
