---
# AWX Job Template target. Runs `terraform init` + `apply` on your behalf.
# Attach an "Amazon Web Services" credential to this Job Template so
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are present in the environment
# for the AWS provider to use.
- name: Provision AWS infrastructure with Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    tf_project_path: "{{ playbook_dir }}/../group_vars/all/terraform_backend.yml"

  tasks:
    - name: Run terraform apply
      cloud.terraform.terraform:
        project_path: "{{ tf_project_path }}"
        state: present
        force_init: true
        backend_config:
          bucket: "{{ tf_state_bucket }}"
          key: "{{ tf_state_key }}"
          region: "{{ tf_state_region }}"
          dynamodb_table: "{{ tf_state_dynamodb_table }}"
        variables:
          key_name: "{{ aws_key_pair_name | default('REPLACE_WITH_YOUR_AWS_KEYPAIR_NAME') }}"
      register: tf_result

    - name: Show new instance IPs
      debug:
        msg: "Provisioned IPs: {{ tf_result.outputs.instance_public_ips.value | default('n/a') }}"
